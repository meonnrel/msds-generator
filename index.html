<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSDS Generator — Instant PubChem Pre-Lab Material Safety Data Sheets</title>
    <meta name="description" content="A free, open-source static web application that generates formatted Material Safety Data Sheets (MSDS / SDS) using chemical data from PubChem for lab students and researchers.">
    <meta name="author" content="@meonnrel">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="MSDS Generator — Instant PubChem Safety Data Sheet Creator">
    <meta property="og:description" content="Generate formatted pre-lab Material Safety Data Sheets directly from PubChem in seconds. Export to Word, PDF, or CSV for free.">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- docx.js library for client-side Word document export -->
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- Header Navbar -->
        <header class="navbar">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fas fa-flask-vial"></i>
                </div>
                <div class="brand-text">
                    <h1>MSDS Generator</h1>
                    <p>For pre-lab crammers like you and me! :3</p>
                </div>
            </div>
            <div class="nav-actions">
                <button type="button" class="btn-icon" id="themeToggleBtn" title="Toggle Theme">
                    <i class="fas fa-sun"></i>
                </button>
                <a href="https://github.com/meonnrel" target="_blank" rel="noopener" class="btn-icon" title="GitHub Repository">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </header>

        <!-- Main Workspace Grid -->
        <main class="main-grid">

            <!-- Left Panel: Controls & Reagents Builder -->
            <section class="panel-card left-panel">
                <div class="panel-header">
                    <h2 class="panel-title">
                        <i class="fas fa-vial"></i> Reagent Builder
                    </h2>
                </div>

                <!-- Common Pre-lab Reagent Presets -->
                <div class="presets-section">
                    <div class="presets-label">Quick Chemical Presets</div>
                    <div class="presets-wrap" id="presetsWrap">
                        <!-- Populated dynamically via JS -->
                    </div>
                </div>

                <!-- Document Options -->
                <div class="doc-options-grid">
                    <div class="form-group">
                        <label for="filenameInput">Output Document Name</label>
                        <input type="text" id="filenameInput" class="input-control" value="MSDS_Output.docx" placeholder="e.g. PreLab_MSDS.docx">
                    </div>
                    <div class="form-group">
                        <label>Data Source</label>
                        <input type="text" class="input-control" value="NCBI PubChem PUG REST" disabled style="opacity: 0.75;">
                    </div>
                </div>

                <!-- Reagents List Container -->
                <div class="reagents-list" id="reagentsList">
                    <!-- Reagent cards added dynamically -->
                </div>

                <!-- Action Controls -->
                <div class="action-bar">
                    <button type="button" class="btn-secondary" id="btnAddReagent">
                        <i class="fas fa-plus-circle"></i> Add Reagent
                    </button>
                    <button type="button" class="btn-primary" id="btnGenerate">
                        <i class="fas fa-bolt"></i> Generate MSDS
                    </button>
                </div>
            </section>

            <!-- Right Panel: Live MSDS Preview & Export -->
            <section class="panel-card right-panel">
                <div class="msds-preview-container">
                    <div class="preview-toolbar">
                        <h2 class="panel-title">
                            <i class="fas fa-file-invoice"></i> MSDS Table Preview
                        </h2>
                        <div class="export-btns">
                            <button type="button" class="btn-export docx" id="btnExportDocx" title="Export to Word Document">
                                <i class="fas fa-file-word"></i> Download .docx
                            </button>
                            <button type="button" class="btn-export" id="btnExportCsv" title="Export to CSV">
                                <i class="fas fa-file-csv"></i> CSV
                            </button>
                            <button type="button" class="btn-export" id="btnCopyClipboard" title="Copy Formatted Table">
                                <i class="fas fa-copy"></i> Copy
                            </button>
                            <button type="button" class="btn-export" id="btnPrintMsds" title="Print Document">
                                <i class="fas fa-print"></i> Print
                            </button>
                        </div>
                    </div>

                    <!-- Live MSDS Formatted Paper View -->
                    <div class="msds-paper" id="msdsPaper">
                        <div class="empty-state">
                            <i class="fas fa-flask"></i>
                            <h3>No Chemicals Generated Yet</h3>
                            <p>Select a quick preset above or type a chemical name to generate your MSDS table.</p>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>coded with <i class="fas fa-heart" style="color: #ef4444;"></i> by <a href="https://www.instagram.com/meonnrel/" target="_blank" rel="noopener">@meonnrel</a></p>
        </footer>

    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Application Script -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
